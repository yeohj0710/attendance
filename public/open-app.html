<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앱 여는 중</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f8fb; color: #172033;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  .box { max-width: 420px; padding: 24px; border-radius: 12px; background: #fff; border: 1px solid #e1e7f0; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 18px; }
  p { margin: 0 0 14px; font-size: 14px; line-height: 1.6; color: #4a5470; }
  a, button { display: inline-block; margin: 4px; padding: 9px 16px; border-radius: 8px; border: 0; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; }
  a { background: #ff9a1f; color: #fff; }
  button { background: #eef1f6; color: #172033; }
</style>
</head>
<body>
<!--
  출퇴근기록부의 "도움받기"가 새 탭으로 여는 중간 페이지.
  노션 안(iframe)에서는 claude://, codex:// 로 바로 이동하면 노션이 막아서(화면이 "차단됨"으로 바뀜),
  새 탭의 이 페이지에서 앱 주소로 이동한다. claude:// 와 codex:// 만 연다(다른 주소는 거절).
-->
<div class="box">
  <h1 id="title">앱을 여는 중이에요</h1>
  <p id="msg">브라우저가 "열까요?"라고 물으면 열기를 눌러 주세요. "항상 허용"에 체크해 두면 다음부터는 안 물어봐요.</p>
  <a id="again" href="#">다시 열기</a>
  <button onclick="window.close()" type="button">이 탭 닫기</button>
</div>
<script>
  (function () {
    var u = new URLSearchParams(location.search).get("u") || "";
    var ok = /^(claude|codex):\/\//.test(u);
    var again = document.getElementById("again");
    if (!ok) {
      document.getElementById("title").textContent = "열 수 없는 주소예요";
      document.getElementById("msg").textContent = "Claude 나 Codex 앱 주소만 열 수 있어요.";
      again.style.display = "none";
      return;
    }
    again.href = u;
    location.href = u;
    // 앱이 열리면 이 탭은 필요 없다. 브라우저가 허용하면 잠시 뒤 스스로 닫는다.
    setTimeout(function () { try { window.close(); } catch (e) {} }, 4000);
  })();
</script>
</body>
</html>
